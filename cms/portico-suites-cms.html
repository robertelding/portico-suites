<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portico Suites CMS — Site Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F3F0E8; --ivory-deep:#EAE5D8; --olive:#34402F; --olive-deep:#283224;
    --bronze:#8A6A3B; --gold:#C4A55E; --ink:#33382F; --line:#DCD4C2; --white:#FCFBF7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Montserrat',sans-serif;background:var(--ivory);color:var(--ink);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;cursor:pointer}

  /* TOP BAR */
  .topbar{background:var(--olive);color:var(--ivory);display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:58px;flex-shrink:0}
  .topbar .brand{font-family:'Cinzel',serif;letter-spacing:.14em;font-size:15px}
  .topbar .brand small{display:block;font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
  .topbar .actions{display:flex;gap:8px;align-items:center}
  .tb-btn{background:transparent;border:1px solid rgba(243,240,232,.35);color:var(--ivory);padding:8px 14px;border-radius:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
  .tb-btn:hover{border-color:var(--gold);color:var(--gold)}
  .tb-btn.primary{background:var(--bronze);border-color:var(--bronze)}
  .tb-btn.primary:hover{background:#75592f;color:var(--ivory)}
  #saveStatus{font-size:11px;color:var(--gold);letter-spacing:.06em;min-width:110px;text-align:right}

  /* LAYOUT */
  .app{display:flex;flex:1;min-height:0}
  .sidebar{width:200px;background:var(--white);border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0;padding:14px 0}
  .side-group{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#9a927e;font-weight:700;padding:14px 18px 6px}
  .side-item{display:block;width:100%;text-align:left;background:none;border:none;border-left:3px solid transparent;padding:9px 18px;font-size:13px;color:var(--ink)}
  .side-item:hover{background:var(--ivory)}
  .side-item.active{border-left-color:var(--bronze);background:var(--ivory);font-weight:600;color:var(--olive)}

  .editor{width:400px;border-right:1px solid var(--line);overflow-y:auto;padding:22px;background:var(--ivory);flex-shrink:0}
  .editor h2{font-family:'Cinzel',serif;font-size:17px;color:var(--olive);letter-spacing:.06em;margin-bottom:4px}
  .editor .hint{font-size:12px;color:#7d7a6c;margin-bottom:18px;font-weight:300}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);margin-bottom:6px}
  .field input[type=text],.field input[type=password],.field input[type=number],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-family:inherit;font-size:13px;background:var(--white);color:var(--ink)}
  .field textarea{min-height:76px;resize:vertical;line-height:1.5}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  .field .sub{font-size:11px;color:#8a8272;margin-top:4px;font-weight:300}

  .color-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .color-row input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:4px;background:none;padding:2px;cursor:pointer}
  .color-row span{font-size:12px}

  .img-slot{border:1.5px dashed var(--line);border-radius:4px;padding:10px;text-align:center;background:var(--white);margin-bottom:6px}
  .img-slot img{max-height:90px;margin:0 auto 8px;border-radius:3px}
  .img-slot .empty{font-size:12px;color:#9a927e;padding:16px 0}
  .img-btns{display:flex;gap:6px;justify-content:center}
  .mini-btn{border:1px solid var(--line);background:var(--white);border-radius:4px;padding:5px 10px;font-size:11px;font-weight:600}
  .mini-btn:hover{border-color:var(--bronze);color:var(--bronze)}
  .mini-btn.danger:hover{border-color:#a04b3a;color:#a04b3a}

  .list-item{border:1px solid var(--line);border-radius:4px;background:var(--white);padding:14px;margin-bottom:10px;position:relative}
  .list-item .li-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .list-item .li-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--olive)}
  .li-controls{display:flex;gap:4px}
  .add-btn{width:100%;border:1.5px dashed var(--bronze);background:none;color:var(--bronze);border-radius:4px;padding:10px;font-size:12px;font-weight:600;letter-spacing:.08em}
  .add-btn:hover{background:#f4ecdd}

  /* Layout tab */
  .layout-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--white);border-radius:4px;padding:12px 14px;margin-bottom:8px}
  .layout-row .name{flex:1;font-size:13px;font-weight:500}
  .layout-row.hidden-sec .name{color:#a89f8b;text-decoration:line-through}
  .switch{position:relative;width:36px;height:20px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#cfc8b6;border-radius:999px;transition:.2s;cursor:pointer}
  .slider:before{content:'';position:absolute;height:14px;width:14px;left:3px;top:3px;background:var(--white);border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--bronze)}
  .switch input:checked + .slider:before{transform:translateX(16px)}

  /* PREVIEW */
  .preview{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--ivory-deep)}
  .preview-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--white)}
  .preview-bar .label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:#9a927e}
  .dev-toggle{display:flex;gap:6px}
  .dev-btn{border:1px solid var(--line);background:var(--white);border-radius:4px;padding:5px 12px;font-size:11px;font-weight:600}
  .dev-btn.active{background:var(--olive);color:var(--ivory);border-color:var(--olive)}
  .preview-frame-wrap{flex:1;display:flex;justify-content:center;overflow:auto;padding:16px}
  #previewFrame{border:1px solid var(--line);background:#fff;width:100%;height:100%;border-radius:4px;transition:width .25s}
  #previewFrame.mobile{width:390px;flex-shrink:0}

  @media(max-width:1100px){.editor{width:340px}}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--olive);color:var(--ivory);padding:12px 20px;border-radius:4px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1;transform:none}

  /* AUTH GATE */
  .auth-gate{position:fixed;inset:0;z-index:200;background:var(--olive-deep);display:flex;align-items:center;justify-content:center;padding:24px}
  .auth-card{background:var(--white);border-radius:6px;padding:40px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.4);position:relative}
  .auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--bronze),var(--gold),var(--bronze));border-radius:6px 6px 0 0}
  .auth-card .auth-logo{height:80px;margin:0 auto 18px;display:block}
  .auth-card h1{font-family:'Cinzel',serif;font-size:17px;letter-spacing:.14em;color:var(--olive);text-align:center;margin-bottom:4px}
  .auth-card .auth-sub{text-align:center;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--bronze);font-weight:600;margin-bottom:26px}
  .auth-card .field input{background:var(--ivory)}
  .auth-btn{width:100%;background:var(--olive);color:var(--ivory);border:none;border-radius:4px;padding:14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-top:6px}
  .auth-btn:hover{background:var(--olive-deep)}
  .auth-links{display:flex;justify-content:center;gap:18px;margin-top:18px;font-size:12px}
  .auth-links a{color:var(--bronze);cursor:pointer;text-decoration:none;font-weight:500}
  .auth-links a:hover{text-decoration:underline}
  .auth-error{background:#f6e8e4;border:1px solid #d8ad9f;color:#8c4a35;border-radius:4px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;display:none}
  .auth-error.show{display:block}
  .auth-notice{background:#f4eedd;border:1px solid var(--gold);color:#6d5426;border-radius:4px;padding:12px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.6}
  .auth-notice code{background:var(--white);border:1px solid var(--line);padding:2px 8px;border-radius:3px;font-size:14px;letter-spacing:.14em;user-select:all}
  .user-chip{font-size:11px;letter-spacing:.06em;color:var(--gold);margin-right:6px}
  .user-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--white);border-radius:4px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap}
  .user-row .u-email{flex:1;font-size:13px;font-weight:500;min-width:150px;word-break:break-all}
  .user-row .u-role{font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ivory-deep);color:#7d7a6c}
  .user-row .u-role.master{background:var(--olive);color:var(--gold)}
</style>
</head>

/* Bring older saved/imported content up to the current model */
function normalizeContent(){
  const D = DEFAULT_CONTENT;
  content.custom = content.custom || {};
  ['newsletter','blog','seo','fbads'].forEach(k => {
    if(!content[k]) content[k] = JSON.parse(JSON.stringify(D[k]));
  });
  content.seo.facts = content.seo.facts || [];
  content.seo.tasks = content.seo.tasks || {};
  content.blog.posts = content.blog.posts || [];
  const polIdx = () => { const i = content.layout.findIndex(s=>s.id==='policies'); return i<0 ? content.layout.length : i; };
  if(!content.layout.find(s=>s.id==='blog'))
    content.layout.splice(polIdx(), 0, {id:'blog', name:'Blog / Journal', visible:true});
  if(!content.layout.find(s=>s.id==='newsletter'))
    content.layout.splice(polIdx(), 0, {id:'newsletter', name:'Newsletter Signup', visible:true});
}

/* ============ UTILITIES ============ */
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function get(path){ return path.split('.').reduce((o,k)=> o?.[k], content); }
function set(path, val){
  const keys = path.split('.'); const last = keys.pop();
  const obj = keys.reduce((o,k)=> o[k], content);
  obj[last] = val; markDirty(); refreshPreview();
}
function markDirty(){ dirty = true; $('saveStatus').textContent = 'Unsaved changes'; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

/* Image upload with compression */
function pickImage(cb){
  const fp = $('filePick');
  fp.onchange = () => {
    const file = fp.files[0]; fp.value='';
    if(!file) return;
    const img = new Image();
    img.onload = () => {
      const MAX = 1600;
      let {width:w, height:h} = img;
      if(w > MAX){ h = h * MAX / w; w = MAX; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.src = URL.createObjectURL(file);
  };
  fp.click();
}

/* ============ FIELD HELPERS ============ */
function textField(label, path, hint){
  return `<div class="field"><label>${label}</label>
    <input type="text" value="${esc(get(path))}" oninput="set('${path}', this.value)">
    ${hint?`<div class="sub">${hint}</div>`:''}</div>`;
}
function areaField(label, path, hint){
  return `<div class="field"><label>${label}</label>
    <textarea oninput="set('${path}', this.value)">${esc(get(path))}</textarea>
    ${hint?`<div class="sub">${hint}</div>`:''}</div>`;
}
function numField(label, path, hint){
  return `<div class="field"><label>${label}</label>
    <input type="number" min="0" value="${esc(get(path))}" oninput="set('${path}', parseFloat(this.value)||0)">
    ${hint?`<div class="sub">${hint}</div>`:''}</div>`;
}
function imageField(label, path, hint){
  const src = get(path);
  return `<div class="field"><label>${label}</label>
    <div class="img-slot">
      ${src ? `<img src="${src}" alt="">` : `<div class="empty">No image set</div>`}
      <div class="img-btns">
        <button class="mini-btn" onclick="pickImage(d => set('${path}', d))">${src?'Replace':'Upload'}</button>
        ${src ? `<button class="mini-btn danger" onclick="set('${path}', null)">Remove</button>` : ''}
      </div>
    </div>${hint?`<div class="sub">${hint}</div>`:''}</div>`;
}
function listControls(arrPath, i, len){
  return `<div class="li-controls">
    <button class="mini-btn" ${i===0?'disabled':''} onclick="moveItem('${arrPath}',${i},-1)">↑</button>
    <button class="mini-btn" ${i===len-1?'disabled':''} onclick="moveItem('${arrPath}',${i},1)">↓</button>
    <button class="mini-btn danger" onclick="removeItem('${arrPath}',${i})">✕</button>
  </div>`;
}
function moveItem(arrPath, i, d){
  const arr = get(arrPath); const j = i + d;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  markDirty(); renderEditor(); refreshPreview();
}
function removeItem(arrPath, i){
  get(arrPath).splice(i,1);
  markDirty(); renderEditor(); refreshPreview();
}
function addItem(arrPath, template){
  get(arrPath).push(JSON.parse(template));
  markDirty(); renderEditor(); refreshPreview();
}

/* ============ CUSTOM SECTIONS ============ */
const SECTION_TYPES = {
  text:  'Text block — centred heading and paragraphs',
  split: 'Text + image — side-by-side, like the Location section',
  banner:'Photo banner — full-width image with a heading overlay',
  cards: 'Card grid — a set of titled cards, like the reviews'
};
function addCustomSection(){
  const id = 'c' + Date.now().toString(36);
  content.custom = content.custom || {};
  content.custom[id] = {type:'text', bg:'', showNav:false, eyebrow:'New Section', heading:'Section Heading',
    body:'Write your content here. Leave a blank line between paragraphs.', image:null, imageSide:'right', items:[]};
  content.layout.push({id, name:'New Section', visible:true, custom:true});
  markDirty(); refreshPreview(); switchTab(id);
}
function deleteCustomSection(id){
  if(!confirm('Delete this section and its content? This cannot be undone — use Backup first if unsure.')) return;
  content.layout = content.layout.filter(s => s.id !== id);
  delete content.custom[id];
  markDirty(); refreshPreview(); switchTab('layoutTab');
}
function setSectionName(id, v){
  const entry = content.layout.find(s => s.id === id);
  if(entry) entry.name = v;
  markDirty(); renderSidebar(); refreshPreview();
}
function customEditor(id){
  const s = content.custom[id];
  const entry = content.layout.find(l => l.id === id) || {name:''};
  let fields = '';
  if(s.type === 'banner'){
    fields = imageField('Banner photo', `custom.${id}.image`, 'Full-width image with a dark overlay for legibility.')
      + textField('Heading', `custom.${id}.heading`)

    fields = textField('Eyebrow', `custom.${id}.eyebrow`)
      + textField('Heading', `custom.${id}.heading`)
      + areaField('Body text', `custom.${id}.body`, 'Blank line = new paragraph.')
      + imageField('Photo', `custom.${id}.image`)
      + `<div class="field"><label>Photo position</label><select onchange="set('custom.${id}.imageSide', this.value)">
          <option value="right" ${s.imageSide!=='left'?'selected':''}>Right of text</option>
          <option value="left" ${s.imageSide==='left'?'selected':''}>Left of text</option></select></div>`;
  } else if(s.type === 'cards'){
    fields = textField('Eyebrow', `custom.${id}.eyebrow`)

      + (s.items||[]).map((it,i)=>`
        <div class="list-item"><div class="li-head"><span class="li-title">Card ${i+1}</span>${listControls(`custom.${id}.items`,i,s.items.length)}</div>
        ${textField('Card title', `custom.${id}.items.${i}.title`)}
        ${areaField('Card text', `custom.${id}.items.${i}.text`)}</div>`).join('')
      + `<button class="add-btn" onclick='addItem("custom.${id}.items", JSON.stringify({title:"New card", text:""}))'>+ Add card</button>`;
  } else {
    fields = textField('Eyebrow', `custom.${id}.eyebrow`)
      + textField('Heading', `custom.${id}.heading`)
      + areaField('Body text', `custom.${id}.body`, 'Blank line = new paragraph.');

  return `<h2>${esc(entry.name)}</h2><div class="hint">Custom section — reorder or hide it under Layout &amp; Sections.</div>
    <div class="field"><label>Section name</label>
      <input type="text" value="${esc(entry.name)}" oninput="setSectionName('${id}', this.value)">

      <select onchange="set('custom.${id}.type', this.value); renderEditor();">

    ${s.type !== 'banner' ? `<div class="field"><label>Background</label>

      </select></div>` : ''}

    <button class="mini-btn danger" style="margin-top:14px" onclick="deleteCustomSection('${id}')">Delete this section</button>`;

/* ============ SUBSCRIBERS DATABASE ============ */
let subscribers = [];   // [{email, date, source}]
async function loadSubs(){
  if(memoryOnly) return;
  try{ const r = await window.storage.get('portico-subscribers', true);
    if(r && r.value) subscribers = JSON.parse(r.value); }catch(e){}
}
async function saveSubs(){
  if(memoryOnly) return;
  try{ await window.storage.set('portico-subscribers', JSON.stringify(subscribers), true); }
  catch(e){ console.error(e); toast('Could not save subscribers'); }
}
async function addSubscriber(email, source){
  email = (email||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return false;
  if(subscribers.find(s => s.email === email)) return true; // already on list
  subscribers.push({email, date:new Date().toISOString().slice(0,10), source: source||'manual'});
  await saveSubs();
  return true;
}
window.cmsCaptureEmail = async function(email){   // called by the preview iframe signup form
  const ok = await addSubscriber(email, 'website');
  if(ok){ toast('New subscriber captured: ' + email); if(activeTab==='subscribers') renderEditor(); refreshPreview(); }
  return ok;
};
window.cmsDeleteSub = async function(email){       // called from the database view
  const i = subscribers.findIndex(s => s.email === email);
  if(i >= 0){ subscribers.splice(i,1); await saveSubs(); renderEditor(); refreshPreview(); toast('Subscriber removed'); }
};

function genAdCopy(){
  const B = content.branding, F = content.fbads;
  const savings = 'Book direct & save 12% vs Airbnb';
  F.headlines = [
    `${B.name} — Boutique Stay in Harrogate`,
    savings + ' — best rate guaranteed',
    `Sleeps 6 · Central Harrogate · Book Direct`
  ];
  F.primaries = [
    (content.hero.sub || '') + ' Minutes from Bettys, the Valley Gardens and the town centre.',
    `Your Harrogate escape, done properly. ${content.pillars.map(p=>p.title).slice(0,3).join(' · ')}. No platform fees, instant confirmation, and the best rate always comes from booking direct.`
  ];
  markDirty(); renderEditor(); refreshPreview(); toast('Ad copy generated from site content');
}
function fbCombos(){
  const F = content.fbads;
  const imgs = F.imageSlots.map(i => content.gallery.images[i]).filter(Boolean);
  return { imgs, count: Math.max(imgs.length,1) * Math.max(F.headlines.length,1) * Math.max(F.primaries.length,1) };
}
function campaignPayload(){
  const F = content.fbads, S = content.seo;
  const link = (S.siteUrl || 'https://porticosuites.com') + '/?utm_source=facebook&utm_medium=paid&utm_campaign=portico_direct';
  return {
    campaign:{
      name:`Portico Direct — ${new Date().toISOString().slice(0,10)}`,
      objective:F.objective, buying_type:'AUCTION', special_ad_categories:[],
      daily_budget: Math.round(F.dailyBudget*100),            // minor units
      bid_strategy:'LOWEST_COST_WITHOUT_CAP',
      campaign_budget_optimization:true, status:'PAUSED'      // launches paused for final human review
    },
    duration_days:F.durationDays,
    adsets: F.audiences.filter(a=>a.enabled).map(a=>({
      name:a.name, description:a.desc,
      optimization_goal: F.objective==='OUTCOME_LEADS' ? 'LEAD_GENERATION' : 'LANDING_PAGE_VIEWS',
      billing_event:'IMPRESSIONS', targeting_note:a.desc,
      dynamic_creative:true, placements:'ADVANTAGE_PLUS'      // automatic placements
    })),
    creative:{
      dynamic_asset_feed:{
        titles:F.headlines, bodies:F.primaries,
        images:F.imageSlots.map(i=>({gallery_slot:i, label:content.gallery.images[i]?.label||''})),
        link, call_to_action:'BOOK_TRAVEL'
      }
    },
    accounts:{ ad_account_id:F.adAccountId, page_id:F.pageId, pixel_id:F.pixelId }
  };
}
function exportCampaign(){
  download('portico-fb-campaign.json', JSON.stringify(campaignPayload(), null, 2), 'application/json');
  toast('Campaign JSON exported');
}
async function pushCampaign(){
  const F = content.fbads;
  if(!F.apiBase) return toast('Set your booking-engine server URL first (Server API base)');
  if(!F.adAccountId || !F.pageId) return toast('Ad Account ID and Page ID are required');
  if(!F.headlines.length) return toast('Generate or write ad copy first');
  try{
    const r = await fetch(F.apiBase.replace(/\/$/,'') + '/api/meta/campaign', {

function importSubsCSV(){
  const jp = $('jsonPick'); jp.accept = '.csv,text/csv';
  jp.onchange = () => {
    const f = jp.files[0]; jp.value=''; jp.accept='application/json';
    if(!f) return;
    const r = new FileReader();
    r.onload = async () => {
      let added = 0;
      for(const line of r.result.split(/\r?\n/)){
        const em = line.split(',')[0].trim();
        if(em && em !== 'email' && await addSubscriber(em, 'import')) added++;
      }
      renderEditor(); toast(added + ' subscribers imported');
    };
    r.readAsText(f);
  };
  jp.click();
}

function seoHealthCheck(){
  const s = content.seo, checks = [];
  const P=(ok,warn,name,fix)=>checks.push({ok,warn,name,fix});
  const tl = (s.metaTitle||'').length;
  P(tl>=30 && tl<=60, tl>0, `Meta title length (${tl} chars)`, 'Aim for 30–60 characters including the brand and location.');
  const dl = (s.metaDescription||'').length;
  P(dl>=120 && dl<=160, dl>0, `Meta description length (${dl} chars)`, 'Aim for 120–160 characters answering "what, where, why book direct".');
  P(!!s.siteUrl && s.siteUrl.startsWith('https://'), false, 'Canonical site URL set', 'Set your live https:// domain so canonical tags and sitemaps are correct.');
  P(s.answerBlock && s.facts.length >= 3, s.facts.length>0, `Answer block for AI extraction (${s.facts.length} Q&As)`, 'Keep 3–6 short, definitive Q&As — these feed the visible Key Facts block and FAQ schema.');
  P(true, false, 'Structured data (schema.org)', 'LodgingBusiness, FAQPage and BlogPosting JSON-LD are generated automatically on export.');
  P(!!s.ogImage, false, 'Social/OG share image', 'Upload a wide photo (1200×630) so links shared to social and chat look right.');
  const noCaption = content.gallery.images.filter(g=>!g.label?.trim()).length;
  P(noCaption===0, true, 'Image captions / alt text', 'Every gallery slot should have a descriptive caption — used as alt text.');
  const pub = content.blog.posts.filter(p=>p.published);
  P(pub.length>0, false, `Published blog posts (${pub.length})`, 'Topic-cluster posts (Harrogate guides, seasonal stays) build topical authority.');
  const newest = pub.map(p=>p.date).sort().pop();
  const fresh = newest && (Date.now() - new Date(newest).getTime()) < 92*86400000;
  P(!!fresh, pub.length>0, 'Content freshness (updated in last 90 days)', 'AI engines favour recently verified content — refresh key pages quarterly.');
  P(false, true, 'Off-site mentions (manual task)', 'Earn mentions on TripAdvisor, Reddit r/harrogate, Visit Harrogate, local press — AI engines cross-reference these for trust.');
  return checks;
}

/* ============ PERSISTENCE (shared across all editors) ============ */
async function saveContent(showToast){
  if(content.seo) content.seo.lastUpdated = new Date().toISOString().slice(0,10);
  try{
    if(window.storage){
      await window.storage.set('portico-cms-content', JSON.stringify(content), true);
      dirty = false;
      $('saveStatus').textContent = 'Saved ' + new Date().toLocaleTimeString();
      if(showToast) toast('Saved — all editors now see this version');
      return;
    }
  }catch(e){ console.error('Storage save failed', e); }
  if(showToast) toast('Persistent storage unavailable here — use Backup to download a JSON copy');
}
async function loadContent(){
  try{
    if(window.storage){
      const r = await window.storage.get('portico-cms-content', true);
      if(r && r.value){
        content = JSON.parse(r.value);
        normalizeContent();
        $('saveStatus').textContent = 'Loaded saved content';
        return;
      }
    }
  }catch(e){ /* no saved content yet */ }
}

/* ============ AUTH SYSTEM ============ */
const MASTER_EMAIL = 'robert.elding@gmail.com';
let currentUser = null;
let users = {};          // email -> {salt, hash, role, mustChange, resetSalt, resetHash}
let lastIssued = null;   // one-time display of generated credentials
let memoryOnly = false;  // true when window.storage is unavailable

function randToken(len){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const buf = new Uint8Array(len);
  crypto.getRandomValues(buf);
  return Array.from(buf, b => chars[b % chars.length]).join('');
}
async function hashPw(pw, salt){
  const data = new TextEncoder().encode(salt + '::' + pw);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function makeCred(pw){
  const salt = randToken(16);
  return { salt, hash: await hashPw(pw, salt) };
}

async function loadUsers(){
  if(!window.storage){ memoryOnly = true; return; }
  try{
    const r = await window.storage.get('portico-cms-users', true);
    if(r && r.value) users = JSON.parse(r.value);
  }catch(e){ /* first run — no users yet */ }
}
async function saveUsers(){
  if(memoryOnly) return;
  try{ await window.storage.set('portico-cms-users', JSON.stringify(users), true); }
  catch(e){ console.error('User save failed', e); toast('Could not save user accounts'); }
}

async function doSetup(){
  const p1 = $('suPw1').value, p2 = $('suPw2').value;
  if(p1.length < 8) return authError('Password must be at least 8 characters.');
  if(p1 !== p2) return authError('Passwords do not match.');
  const cred = await makeCred(p1);
  const recovery = randToken(12);
  const rc = await makeCred(recovery);
  users[MASTER_EMAIL] = { ...cred, role:'master', mustChange:false, resetSalt:rc.salt, resetHash:rc.hash };
  await saveUsers();
  authError('');
  authNotice(`Master account created. Your <strong>recovery code</strong> (needed if you ever forget your password) is:<br>
    <code>${recovery}</code><br>Store it somewhere safe — it will not be shown again.`);
  $('authForm').innerHTML = `<button class="auth-btn" onclick="viewLogin()">Continue to sign in</button>`;
}

function viewLogin(prefill){
  authError(''); authNotice('');
  $('authForm').innerHTML = `
    <div class="field"><label>Email address</label><input type="text" id="liEmail" autocomplete="username" value="${esc(prefill||'')}"></div>
    <div class="field"><label>Password</label><input type="password" id="liPw" autocomplete="current-password"></div>
    <button class="auth-btn" onclick="doLogin()">Sign in</button>
    <div class="auth-links"><a onclick="viewReset()">Forgot password?</a></div>`;
  $('liPw').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
}
async function doLogin(){
  const email = $('liEmail').value.trim().toLowerCase();
  const pw = $('liPw').value;
  const u = users[email];
  if(!u) return authError('No account found for that email address.');
  const h = await hashPw(pw, u.salt);
  if(h !== u.hash) return authError('Incorrect password.');
  if(u.mustChange){ return viewChangePw(email, 'Set a new password to replace your temporary one.'); }
  await startSession(email);
}

function viewChangePw(email, msg){
  authError(''); authNotice(msg || '');
  $('authForm').innerHTML = `
    <div class="field"><label>New password</label><input type="password" id="cpPw1" autocomplete="new-password"></div>
    <div class="field"><label>Confirm new password</label><input type="password" id="cpPw2" autocomplete="new-password"></div>
    <button class="auth-btn" onclick="doChangePw('${esc(email)}')">Save & continue</button>`;
}
async function doChangePw(email){
  const p1 = $('cpPw1').value, p2 = $('cpPw2').value;
  if(p1.length < 8) return authError('Password must be at least 8 characters.');
  if(p1 !== p2) return authError('Passwords do not match.');
  const cred = await makeCred(p1);
  users[email] = { ...users[email], ...cred, mustChange:false, resetSalt:null, resetHash:null };
  await saveUsers();
  await startSession(email);
}

function viewReset(){
  authError('');
  authNotice(`Enter your email and your reset code.<br>
    <strong>Editors:</strong> ask the master user to issue you a reset code.<br>
    <strong>Master user:</strong> use the recovery code from setup.`);
  $('authForm').innerHTML = `
    <div class="field"><label>Email address</label><input type="text" id="rsEmail" autocomplete="username"></div>
    <div class="field"><label>Reset / recovery code</label><input type="text" id="rsCode" style="letter-spacing:.14em"></div>
    <button class="auth-btn" onclick="doReset()">Verify code</button>
    <div class="auth-links"><a onclick="viewLogin()">Back to sign in</a></div>`;
}
async function doReset(){
  const email = $('rsEmail').value.trim().toLowerCase();
  const code = $('rsCode').value.trim().toUpperCase();
  const u = users[email];
  if(!u || !u.resetHash) return authError('No valid reset code exists for that account.');
  const h = await hashPw(code, u.resetSalt);
  if(h !== u.resetHash) return authError('That code is not correct.');
  viewChangePw(email, 'Code accepted — choose a new password.');
}

/* ---- Session ---- */
async function startSession(email){
  currentUser = { email, role: users[email].role };
  if(!memoryOnly){
    try{ await window.storage.set('portico-cms-session', JSON.stringify({email})); }catch(e){}
  }
  $('authGate').style.display = 'none';
  $('userChip').textContent = (currentUser.role === 'master' ? '★ ' : '') + email;
  renderSidebar(); renderEditor(); refreshPreview();
}
async function resumeSession(){
  if(memoryOnly) return false;
  try{
    const r = await window.storage.get('portico-cms-session');
    if(r && r.value){
      const s = JSON.parse(r.value);
      if(s.email && users[s.email] && !users[s.email].mustChange){
        currentUser = { email: s.email, role: users[s.email].role };
        $('authGate').style.display = 'none';
        $('userChip').textContent = (currentUser.role === 'master' ? '★ ' : '') + s.email;
        return true;
      }
    }
  }catch(e){}
  return false;
}
async function logout(){
  currentUser = null;
  if(!memoryOnly){ try{ await window.storage.delete('portico-cms-session'); }catch(e){} }
  $('authGate').style.display = 'flex';
  viewLogin();
}

/* ---- Editor management (master only) ---- */
async function addEditor(){
  if(currentUser?.role !== 'master') return;
  const email = $('newEditorEmail').value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter a valid email address');
  if(users[email]) return toast('An account already exists for that email');
  const temp = randToken(10);
  const cred = await makeCred(temp);
  users[email] = { ...cred, role:'editor', mustChange:true, resetSalt:null, resetHash:null };
  await saveUsers();
  lastIssued = { email, code: temp, type:'Temporary password' };
  renderEditor();
  toast('Editor added');
}
async function deleteEditor(email){
  if(currentUser?.role !== 'master' || users[email]?.role === 'master') return;
  if(!confirm('Remove editor access for ' + email + '? They will no longer be able to sign in.')) return;
  delete users[email];
  if(lastIssued?.email === email) lastIssued = null;
  await saveUsers();
  renderEditor();
  toast('Editor removed');
}
async function issueReset(email){
  if(currentUser?.role !== 'master' || !users[email]) return;
  const code = randToken(8);
  const rc = await makeCred(code);
  users[email].resetSalt = rc.salt;
  users[email].resetHash = rc.hash;
  await saveUsers();
  lastIssued = { email, code, type:'Reset code' };
  renderEditor();
  toast('Reset code issued');
}

/* ============ IMPORT / EXPORT ============ */
function download(name, data, type){
  const blob = new Blob([data], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function exportSite(){
  download('portico-suites-franklin-road.html', buildSite(content), 'text/html');
  toast('Website exported — upload this file to your host');
}
function exportJSON(){
  download('portico-cms-backup.json', JSON.stringify(content, null, 2), 'application/json');
  toast('Backup downloaded');
}
function importJSON(){
  const jp = $('jsonPick');
  jp.onchange = () => {
    const f = jp.files[0]; jp.value='';
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        content = JSON.parse(r.result);
        normalizeContent();
        markDirty(); renderEditor(); refreshPreview();
        toast('Backup imported');
      }catch(e){ toast('Could not read that file — is it a CMS backup JSON?'); }
    };
    r.readAsText(f);
  };
  jp.click();
}

/* ============ BOOT ============ */
(async function(){
  if(!window.storage) memoryOnly = true;
  await loadUsers();
  await loadContent();
  normalizeContent();
  await loadSubs();
  await loadTemplates();
  renderSidebar();
  renderEditor();
  refreshPreview();
  if(Object.keys(users).length === 0){
    viewSetup();                      // first run — create master account
  } else if(!(await resumeSession())){
    viewLogin();                      // returning — sign in
  } else {
    renderSidebar();                  // session resumed — re-render with role
  }
})();

/* Autosave every 30s if dirty */
setInterval(() => { if(dirty) saveContent(false); }, 30000);
</script>
